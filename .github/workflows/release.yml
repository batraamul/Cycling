# Builds a SIGNED release APK and publishes it as a GitHub Release when a version tag is pushed:
#     git tag v1.0.1 && git push origin v1.0.1
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CYCLING_KEYSTORE_BASE64   base64 of cycling-release.jks   (base64 -w0 cycling-release.jks)
#   CYCLING_KEYSTORE_PASSWORD keystore password
#   CYCLING_KEY_ALIAS         key alias (cycling)
#   CYCLING_KEY_PASSWORD      key password
# If any secret is missing the job fails: an unsigned APK is never published.
name: Release

on:
  push:
    # v1.0.0 was built and published manually (signing secrets were not yet configured), so it is excluded.
    tags: ["v*", "!v1.0.0"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.CYCLING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::CYCLING_KEYSTORE_BASE64 secret is not set — refusing to build an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CYCLING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed release APK
        env:
          CYCLING_KEYSTORE_PASSWORD: ${{ secrets.CYCLING_KEYSTORE_PASSWORD }}
          CYCLING_KEY_ALIAS: ${{ secrets.CYCLING_KEY_ALIAS }}
          CYCLING_KEY_PASSWORD: ${{ secrets.CYCLING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          VERSION="${GITHUB_REF_NAME:-manual}"
          cp app/build/outputs/apk/release/app-release.apk "Cycling-${VERSION}.apk"
          echo "APK_FILE=Cycling-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILE }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
